# Heap sized for machines with <8 GB RAM: an 8G daemon gets OOM-killed
# mid-build ("Gradle build daemon disappeared unexpectedly", exit 143).
# Also build with JDK 17/21 (JAVA_HOME) — newer system JVMs (e.g. 26) break
# AGP's JdkImageTransform (jlink) on core-for-system-modules.jar.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (needs AGP 9+ and Flutter 3.47+): AGP compiles Kotlin itself,
# so plugins no longer need the legacy Kotlin Gradle Plugin. Leaving this false
# made mobile_scanner apply KGP, which a future Flutter release will reject.
android.builtInKotlin=true
