name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.5.0-alpha)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend-flutter/android/**/*.gradle*', 'frontend-flutter/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Pub get
        working-directory: frontend-flutter
        run: flutter pub get

      - name: Analyze & Test
        working-directory: frontend-flutter
        run: |
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub

      - name: Build release APKs (split-per-abi + obfuscated)
        working-directory: frontend-flutter
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp frontend-flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/AirChat-${{ steps.version.outputs.tag }}-android-arm64.apk
          cp frontend-flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             dist/AirChat-${{ steps.version.outputs.tag }}-android-arm32.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ steps.version.outputs.tag }}
          path: frontend-flutter/build/symbols/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AirChat ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'alpha') || contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'rc') }}
          generate_release_notes: true
          files: |
            dist/AirChat-*.apk
            dist/SHA256SUMS.txt
