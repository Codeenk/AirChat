name: 💡 Feature Request
description: Suggest an idea for AirChat
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you can't?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: privacy
    attributes:
      label: Privacy considerations
      description: How does this affect the zero-knowledge / E2EE model?
